<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapBasket &mdash; everyday goods, honestly priced</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="./index.html">
        <i class="fa-solid fa-cart-shopping"></i>
        SnapBasket
        
      </a>

      <div class="nav-search">
        <input type="text" id="search-input" placeholder="Search products&hellip;" aria-label="Search products" />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <button class="nav-toggler" type="button" id="navbar-toggler" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <i class="fa-solid fa-moon"></i>
      </button>

      <ul class="nav-links" id="navbar">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./index.html?wishlist=1">Saved <span class="cart-badge" id="wishlist-count" style="display:none;">0</span></a></li>
        <li>
          <a class="cart-link" href="./cart.html">
            Cart
            <span class="cart-badge" id="cart-count" style="display:none;">0</span>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <section class="hero">
    <div class="hero-carousel" id="hero-carousel">
      <div class="hero-track" id="hero-track">
        <div class="hero-slide"><img src="./assets/img1.png" alt="" /></div>
        <div class="hero-slide"><img src="./assets/img2.png" alt="" /></div>
        <div class="hero-slide"><img src="./assets/img3.png" alt="" /></div>
        <div class="hero-slide"><img src="./assets/img4.png" alt="" /></div>
      </div>
      <button class="hero-arrow prev" id="hero-prev" aria-label="Previous slide"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="hero-arrow next" id="hero-next" aria-label="Next slide"><i class="fa-solid fa-chevron-right"></i></button>
      <div class="hero-dots" id="hero-dots"></div>
    </div>
  </section>

  <div class="filter-bar">
    <div class="chip-row" id="category-chips">
      <button class="chip active" data-category="all">All</button>
    </div>
    <select class="sort-select" id="sort-select" aria-label="Sort products">
      <option value="default">Sort: Featured</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="rating-desc">Rating: Best First</option>
    </select>
  </div>

  <p class="result-count" id="result-count"></p>

  <div class="product-grid" id="product-container"></div>

  <div class="empty-state" id="empty-state" style="display:none;">
    <i class="fa-solid fa-magnifying-glass"></i>
    <h3>No products match that search</h3>
    <p>Try a different keyword or clear your filters.</p>
    <button class="btn btn-outline" id="clear-filters-btn">Clear filters</button>
  </div>

  <footer class="site-footer">
    <div class="container">
      <a class="brand" href="./index.html"><i class="fa-solid fa-cart-shopping"></i> SnapBasket</a>
      <ul class="footer-links">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./cart.html">Cart</a></li>
      </ul>
      <small>&copy; 2026 SnapBasket. A demo storefront.</small>
    </div>
  </footer>

  <script src="./cart-utils.js"></script>
  <script src="./app.js"></script>
</body>
</html>
