<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapBasket &mdash; Your Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="./index.html">
        <i class="fa-solid fa-cart-shopping"></i>
        SnapBasket
        <span class="tag">General Store</span>
      </a>

      <button class="nav-toggler" type="button" id="navbar-toggler" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <i class="fa-solid fa-moon"></i>
      </button>

      <ul class="nav-links" id="navbar">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./index.html?wishlist=1">Saved <span class="cart-badge" id="wishlist-count" style="display:none;">0</span></a></li>
        <li>
          <a class="cart-link active" href="./cart.html">
            Cart
            <span class="cart-badge" id="cart-count" style="display:none;">0</span>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <div class="container" style="margin-top:26px;">
    <h1 class="page-title">Your cart</h1>
    <p class="page-subtitle" id="cart-subtitle"></p>
  </div>

  <div class="cart-page">
    <ul class="cart-list" id="cart-items"></ul>

    <aside class="summary-card" id="summary-card">
      <h3>Order summary</h3>
      <div class="summary-row"><span>Items</span><span id="summary-items">0</span></div>
      <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
      <div class="summary-total"><span>Total</span><span id="cart-total">$0.00</span></div>
      <button class="btn btn-primary btn-block" id="buy-now-button">
        <i class="fa-solid fa-lock"></i> Checkout
      </button>
      <a class="clear-cart-link" href="#" id="clear-cart-link">Clear cart</a>
    </aside>
  </div>

  <div class="empty-state" id="empty-cart-state" style="display:none;">
    <i class="fa-solid fa-cart-shopping"></i>
    <h3>Your cart is empty</h3>
    <p>Looks like you haven't added anything yet.</p>
    <a class="btn btn-primary" href="./index.html">Start shopping</a>
  </div>

  <script src="./cart-utils.js"></script>
  <script src="./cart.js"></script>
</body>
</html>
