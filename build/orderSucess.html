<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapBasket &mdash; Order Placed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="./index.html">
        <i class="fa-solid fa-cart-shopping"></i>
        SnapBasket
        <span class="tag">General Store</span>
      </a>

      <button class="nav-toggler" type="button" id="navbar-toggler" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <i class="fa-solid fa-moon"></i>
      </button>

      <ul class="nav-links" id="navbar">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./index.html?wishlist=1">Saved <span class="cart-badge" id="wishlist-count" style="display:none;">0</span></a></li>
        <li>
          <a class="cart-link" href="./cart.html">
            Cart
            <span class="cart-badge" id="cart-count" style="display:none;">0</span>
          </a>
        </li>
      </ul>
    </div>
  </header>

  <div class="success-wrap">
    <img src="./assets/order.gif" alt="Order success animation" />
    <h1>Your order is on its way</h1>
    <p>Thanks for shopping with us. A confirmation has been sent to your inbox.</p>
    <div class="order-id" id="order-id">Order #&mdash;</div>
    <div>
      <a class="btn btn-primary" href="./index.html">Continue shopping</a>
    </div>
    <p class="redirect-note" id="redirect-note"></p>
  </div>

  <script src="./cart-utils.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order");
    const total = params.get("total");

    if (orderId) {
      document.getElementById("order-id").textContent =
        `Order #${orderId}` + (total ? ` \u00b7 ${formatPrice(total)}` : "");
    } else {
      document.getElementById("order-id").style.display = "none";
    }

    let seconds = 6;
    const note = document.getElementById("redirect-note");
    const tick = () => {
      note.textContent = `Redirecting to the shop in ${seconds}s\u2026`;
      if (seconds === 0) {
        window.location.href = "./index.html";
        return;
      }
      seconds--;
      setTimeout(tick, 1000);
    };
    tick();
  </script>
</body>
</html>
